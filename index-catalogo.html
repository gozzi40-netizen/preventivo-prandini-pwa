
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preventivo Commerciale Smart - Prandini</title>
  <meta name="theme-color" content="#ad8424" />
  <meta name="description" content="Preventivo commerciale Prandini compilabile, stampabile e installabile." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <style>
    :root {
      --ink: #20242c;
      --muted: #697180;
      --line: #d9dee7;
      --soft: #f6f7f9;
      --paper: #ffffff;
      --gold: #ad8424;
      --red: #a9473f;
      --orange: #b9743e;
      --green: #3f7541;
      --blue: #235f83;
      --shadow: 0 14px 34px rgba(25, 32, 44, .09);
      --radius: 14px;
      --radius-panel: 12px;
      --radius-control: 9px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef1f5;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea, select { font: inherit; }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .toolbar-title span {
      display: block;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 12px;
      font-weight: 850;
    }

    .toolbar-title strong {
      display: block;
      margin-top: 3px;
      font-size: 22px;
      letter-spacing: -.03em;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: var(--paper);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(25, 32, 44, .04);
      transition: .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(25, 32, 44, .08);
    }

    .btn.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .btn.gold {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .sheet {
      background: var(--paper);
      border: 1px solid rgba(217, 222, 231, .75);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 34px;
      overflow: hidden;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      align-items: start;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--gold);
    }

    .brand-dynamic {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 12px;
      min-height: 48px;
    }

    .brand-logo-card {
      height: 42px;
      min-width: 82px;
      max-width: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 8px;
      border: 1px solid rgba(173, 132, 36, .18);
      border-radius: var(--radius-control);
      background: #fff;
    }

    .brand-logo-card img {
      display: block;
      max-height: 30px;
      max-width: 112px;
      width: auto;
      object-fit: contain;
    }

    .brand-logo-card.group-logo {
      border-color: rgba(32, 36, 44, .14);
      background: #fafafa;
    }

    .brand-logo-card.group-logo img {
      max-height: 28px;
      max-width: 105px;
    }

    .field label,
    .panel-title {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .10em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea,
    .cell-input,
    .cell-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      padding: 10px 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-weight: 650;
    }

    .field input:focus,
    .field textarea:focus,
    .cell-input:focus,
    .cell-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(173, 132, 36, .12);
    }

    .quote-meta {
      display: grid;
      grid-template-columns: 1fr 1fr 170px;
      gap: 12px;
    }

    .logo-controls,
    .controls {
      display: grid;
      gap: 12px;
      margin: 20px 0 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--soft);
    }

    .logo-controls {
      grid-template-columns: 180px repeat(4, minmax(130px, 1fr));
      align-items: center;
    }

    .controls {
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      margin-bottom: 24px;
    }

    .panel-title {
      color: var(--gold);
      margin: 0;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-weight: 750;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
    }

    .check input:disabled {
      opacity: .75;
      cursor: not-allowed;
    }

    .sections-panel {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .section-toggle {
      min-height: 66px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: #fff;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(25, 32, 44, .03);
    }

    .section-toggle input {
      margin-top: 2px;
      accent-color: var(--gold);
    }

    .section-toggle strong {
      display: block;
      font-size: 11px;
      line-height: 1.25;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .section-toggle span {
      display: block;
      width: 46px;
      height: 5px;
      margin-top: 6px;
      border-radius: 999px;
      background: var(--gold);
    }

    .section {
      margin: 18px 0 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      overflow: hidden;
      background: #fff;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      color: #fff;
    }

    .section-title {
      font-weight: 900;
      letter-spacing: .10em;
      text-transform: uppercase;
      font-size: 13px;
    }

    .section-actions {
      display: flex;
      gap: 8px;
    }

    .small-btn {
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.14);
      color: #fff;
      border-radius: var(--radius-control);
      padding: 6px 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    th {
      background: #282d35;
      color: #f6dc91;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 12px;
      padding: 10px;
      border-right: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }

    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 0;
    }

    td:last-child,
    th:last-child { border-right: 0; }

    .cell-input,
    .cell-select {
      min-height: 42px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 10px;
      font-weight: 600;
    }

    .cell-select {
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: #f8f9fb;
      margin: 6px;
      width: calc(100% - 12px);
      min-height: 36px;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .cell-input.number,
    .money-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .money-cell {
      padding: 10px 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .delete-row {
      width: 100%;
      min-height: 42px;
      border: 0;
      background: transparent;
      color: #9aa1ad;
      cursor: pointer;
      font-size: 20px;
      padding: 6px;
    }

    .delete-row:hover { color: var(--red); }

    .subtotal-row td {
      background: #fafafa;
      padding: 10px 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
      font-size: 12px;
    }

    .subtotal-row .subtotal-value {
      text-align: right;
      font-size: 14px;
      white-space: nowrap;
    }

    .notes-section {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
      align-items: start;
      margin-top: 24px;
    }

    .notes-section textarea {
      min-height: 98px;
      resize: vertical;
    }

    .totals {
      border-top: 2px solid var(--gold);
      padding-top: 14px;
      margin-left: auto;
      width: min(100%, 430px);
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 7px 0;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .total-line span:first-child {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 13px;
    }

    .total-line.grand {
      color: var(--gold);
      font-size: 24px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      margin-top: 5px;
    }

    .print-help {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    body.hide-discount .col-discount,
    body.hide-unit-price .col-price,
    body.hide-subtotals .subtotal-row,
    body.hide-totals .totals,
    body.hide-iva .iva-line,
    body.hide-iva .col-iva,
    body.hide-actions .col-actions,
    body.hide-actions .section-actions {
      display: none !important;
    }

    @media screen and (max-width: 980px) {
      .app { padding: 12px; }
      .toolbar, .header { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .toolbar-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .btn { width: 100%; text-align: center; }
      .sheet { padding: 16px; }
      .quote-meta,
      .controls,
      .logo-controls,
      .sections-panel,
      .notes-section { grid-template-columns: 1fr; }
      .brand-dynamic { justify-content: center; }
      .brand-logo-card { width: calc(50% - 7px); max-width: none; }
      .brand-logo-card img { max-width: 100%; }
      .section { overflow: visible; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .section-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
      .small-btn { width: 100%; padding: 9px 10px; }
      table, thead, tbody, tr, th, td { display: block; width: 100% !important; }
      thead { display: none; }
      tr[data-row] { border-bottom: 1px solid var(--line); padding: 10px; background: #fff; }
      tr[data-row] td {
        display: grid;
        grid-template-columns: 118px 1fr;
        align-items: center;
        gap: 10px;
        border: 0;
        padding: 5px 0;
        background: transparent;
      }
      tr[data-row] td::before {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .08em;
        font-size: 10px;
        font-weight: 900;
      }
      tr[data-row] td:nth-child(1)::before { content: "Descrizione"; }
      tr[data-row] td:nth-child(2)::before { content: "U.M."; }
      tr[data-row] td:nth-child(3)::before { content: "Q.tà"; }
      tr[data-row] td:nth-child(4)::before { content: "Prezzo"; }
      tr[data-row] td:nth-child(5)::before { content: "Sconto"; }
      tr[data-row] td:nth-child(6)::before { content: "Cod. IVA"; }
      tr[data-row] td:nth-child(7)::before { content: "Netto"; }
      tr[data-row] td:nth-child(8)::before { content: ""; }
      .cell-input,
      .cell-select,
      .money-cell {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: #fff;
        margin: 0;
        width: 100%;
      }
      .money-cell { display: flex; justify-content: flex-end; align-items: center; }
      .delete-row { border: 1px solid var(--line); border-radius: var(--radius-control); background: #fafafa; }
      .subtotal-row { display: grid !important; grid-template-columns: 1fr; padding: 10px; background: #fafafa; }
      .subtotal-row td { border: 0; padding: 4px 0; }
      .subtotal-row td:first-child { font-size: 11px; }
      .subtotal-row .subtotal-value { text-align: right; font-size: 16px; }
      .totals { width: 100%; }
      .total-line.grand { font-size: 20px; }
    }

    @page { size: A4; margin: 10mm; }

    @media print {
      html, body {
        width: 210mm;
        min-height: 297mm;
        overflow: visible !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .app { max-width: none !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .toolbar, .controls, .logo-controls, .sections-panel, .section-actions, .delete-row, .print-help { display: none !important; }
      .sheet {
        width: 190mm !important;
        max-width: 190mm !important;
        margin: 0 auto !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }
      .header {
        grid-template-columns: 1fr !important;
        gap: 0 !important;
        padding-bottom: 8px !important;
        margin-bottom: 8px !important;
        border-bottom: 2px solid var(--gold) !important;
      }
      .brand-dynamic {
        flex-wrap: nowrap !important;
        justify-content: flex-start !important;
        gap: 6mm !important;
        min-height: 20mm !important;
        margin-bottom: 4mm !important;
      }
      .brand-logo-card {
        height: 18mm !important;
        min-width: 0 !important;
        max-width: 42mm !important;
        padding: 1mm 2mm !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
      }
      .brand-logo-card img { max-height: 15mm !important; max-width: 38mm !important; }
      .brand-logo-card.group-logo img { max-height: 13mm !important; max-width: 32mm !important; }
      .quote-meta { grid-template-columns: 1fr 1fr 34mm !important; gap: 8mm !important; width: 100% !important; }
      .field label { font-size: 8.5px !important; margin-bottom: 3px !important; }
      .field input,
      .field textarea {
        border: 0 !important;
        border-radius: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
      }
      .section {
        width: 100% !important;
        margin: 8px 0 11px !important;
        overflow: visible !important;
        border-radius: 10px !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .section-head { padding: 5px 8px !important; }
      .section-title { font-size: 9px !important; }
      table { width: 100% !important; min-width: 0 !important; table-layout: fixed !important; border-collapse: collapse !important; }
      th { padding: 4px 5px !important; font-size: 8px !important; line-height: 1.1 !important; }
      td { padding: 0 !important; }
      th:nth-child(1), td:nth-child(1) { width: 38% !important; }
      th:nth-child(2), td:nth-child(2) { width: 8% !important; }
      th:nth-child(3), td:nth-child(3) { width: 9% !important; }
      th:nth-child(4), td:nth-child(4) { width: 13% !important; }
      th:nth-child(5), td:nth-child(5) { width: 10% !important; }
      th:nth-child(6), td:nth-child(6) { width: 9% !important; }
      th:nth-child(7), td:nth-child(7) { width: 11% !important; }
      th:nth-child(8), td:nth-child(8) { width: 0 !important; display: none !important; }
      .cell-input,
      .cell-select,
      .money-cell {
        padding: 3px 5px !important;
        min-height: 18px !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        font-size: 9.5px !important;
        line-height: 1.2 !important;
      }
      .cell-select {
        appearance: none !important;
        font-weight: 850 !important;
      }
      .subtotal-row td { padding: 4px 6px !important; font-size: 8.5px !important; }
      .subtotal-row .subtotal-value { font-size: 9px !important; }
      .notes-section { grid-template-columns: 1fr 80mm !important; gap: 10mm !important; margin-top: 12px !important; }
      .totals { width: 80mm !important; padding-top: 8px !important; }
      .total-line { padding: 4px 0 !important; }
      .total-line span:first-child { font-size: 8.5px !important; }
      .total-line.grand { font-size: 15px !important; padding-top: 7px !important; }
      .field textarea { font-size: 9px !important; line-height: 1.3 !important; }
      body.hide-discount.hide-iva th:nth-child(1),
      body.hide-discount.hide-iva td:nth-child(1) { width: 48% !important; }
      body.hide-discount.hide-iva th:nth-child(2),
      body.hide-discount.hide-iva td:nth-child(2) { width: 9% !important; }
      body.hide-discount.hide-iva th:nth-child(3),
      body.hide-discount.hide-iva td:nth-child(3) { width: 10% !important; }
      body.hide-discount.hide-iva th:nth-child(4),
      body.hide-discount.hide-iva td:nth-child(4) { width: 15% !important; }
      body.hide-discount.hide-iva th:nth-child(7),
      body.hide-discount.hide-iva td:nth-child(7) { width: 18% !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="toolbar-title">
        <span>Prandini</span>
        <strong>Preventivo commerciale smart</strong>
      </div>
      <div class="toolbar-actions">
        <button class="btn" id="resetBtn" type="button">Nuovo preventivo</button>
        <button class="btn" id="addAllBtn" type="button">Aggiungi una riga per sezione</button>
        <button class="btn primary" id="previewBtn" type="button">Vista PDF pulita</button>
        <button class="btn gold" id="printBtn" type="button">Esporta PDF per Delera</button>
      </div>
    </div>

    <main class="sheet" id="sheet">
      <section class="header">
        <div class="brand-dynamic" id="brandLogos" aria-label="Loghi selezionati"></div>
        <div class="quote-meta">
          <div class="field">
            <label for="clientName">Cliente</label>
            <input id="clientName" placeholder="Nome cliente" />
          </div>
          <div class="field">
            <label for="siteName">Cantiere</label>
            <input id="siteName" placeholder="Indirizzo o riferimento cantiere" />
          </div>
          <div class="field">
            <label for="quoteDate">Data</label>
            <input id="quoteDate" type="date" />
          </div>
        </div>
      </section>

      <section class="logo-controls" aria-label="Selezione loghi">
        <div class="panel-title">Loghi intestazione</div>
        <label class="check"><input type="checkbox" class="logo-check" value="bau" checked disabled /> Bau Group</label>
        <label class="check"><input type="checkbox" class="logo-check" value="progetto" checked /> Progetto Colore</label>
        <label class="check"><input type="checkbox" class="logo-check" value="prandini" checked /> Prandini Ceramiche</label>
        <label class="check"><input type="checkbox" class="logo-check" value="pavinord" /> Pavinord</label>
      </section>

      <section class="controls" aria-label="Opzioni preventivo">
        <label class="check"><input type="checkbox" id="showUnitPrice" checked /> Mostra prezzi unitari</label>
        <label class="check"><input type="checkbox" id="showDiscount" checked /> Mostra sconto</label>
        <label class="check"><input type="checkbox" id="showSubtotals" checked /> Mostra subtotali</label>
        <label class="check"><input type="checkbox" id="showTotals" checked /> Mostra totale finale</label>
        <label class="check"><input type="checkbox" id="showIva" /> Mostra IVA</label>
        <label class="check"><input type="checkbox" id="cleanMode" /> Nascondi pulsanti in pagina</label>
      </section>

      <section class="sections-panel" id="sectionToggles" aria-label="Sezioni preventivo"></section>
      <section id="sectionsContainer"></section>

      <section class="notes-section">
        <div class="field">
          <label for="freeNotes">Note commerciali</label>
          <textarea id="freeNotes" placeholder="Condizioni commerciali, tempi di consegna, validità offerta..."></textarea>
        </div>
        <div class="totals" id="totalsBox">
          <div class="total-line">
            <span>Totale imponibile</span>
            <strong id="totalNet">€ 0,00</strong>
          </div>
          <div class="total-line iva-line">
            <span>IVA</span>
            <strong id="totalIva">€ 0,00</strong>
          </div>
          <div class="total-line grand">
            <span>Totale preventivo</span>
            <strong id="totalGrand">€ 0,00</strong>
          </div>
        </div>
      </section>

      <p class="print-help">Per allegarlo in Delera: Esporta PDF, salva e inserisci il PDF nel contratto.</p>
    </main>
  </div>

  <script>
    const LOGOS = {
      bau: {
        label: "Bau Group",
        src: "logo_bau.png",
        className: "group-logo"
      },
      progetto: {
        label: "Progetto Colore",
        src: "logo_progetto.png",
        className: ""
      },
      prandini: {
        label: "Prandini Ceramiche",
        src: "logo_prandini.png",
        className: ""
      },
      pavinord: {
        label: "Pavinord",
        src: "logo_pavinord.png",
        className: ""
      }
    };

    const logoOrder = ["bau", "progetto", "prandini", "pavinord"];
    const IVA_CODES = [
      { value: "22", label: "22%" },
      { value: "10", label: "10%" },
      { value: "4", label: "4%" },
      { value: "0", label: "Esente" }
    ];

    const categories = [
      {
        id: "pavimenti",
        label: "Pavimenti e rivestimenti",
        color: "#ad8424",
        defaultRows: [
          ["Gres effetto legno 20x120", "mq", 50, 45, 10],
          ["Battiscopa coordinato", "ml", 30, 12, 5]
        ]
      },
      {
        id: "posa",
        label: "Posa pavimenti e rivestimenti",
        color: "#a9473f",
        defaultRows: [
          ["Posa in opera specializzata formato 20x120", "mq", 50, 28, 0],
          ["Preparazione fondo con primer", "mq", 50, 10, 0]
        ]
      },
      {
        id: "materiale",
        label: "Materiale di posa",
        color: "#b9743e",
        defaultRows: [
          ["Primer fissante", "kg", 5, 10, 0],
          ["Stucco 123 bianco antico", "kg", 5, 4, 0],
          ["H40 colla nolimits", "kg", 25, 0.6, 0]
        ]
      },
      {
        id: "sanitari",
        label: "Sanitari e arredobagno",
        color: "#3f7541",
        defaultRows: [
          ["Coppia sanitari filomuro", "nr", 1, 650, 5],
          ["Mobile bagno con specchiera", "nr", 1, 1500, 5]
        ]
      },
      {
        id: "interventi",
        label: "Interventi per ristrutturazione bagno",
        color: "#235f83",
        defaultRows: [
          ["Demolizione e smaltimento pavimenti, rivestimenti e sanitari", "ac", 1, 550, 0],
          ["Rifacimento massetto", "ac", 1, 850, 0],
          ["Nuova impiantistica idraulica completa", "nr", 1, 1200, 0]
        ]
      }
    ];

    const state = { rows: {}, active: {} };
    const euro = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });

    const brandLogos = document.getElementById("brandLogos");
    const sectionToggles = document.getElementById("sectionToggles");
    const sectionsContainer = document.getElementById("sectionsContainer");
    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function uid() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" }[char]));
    }

    function num(value) {
      const normalized = String(value || "0").replace(",", ".");
      const parsed = Number.parseFloat(normalized);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function initState() {
      categories.forEach((cat, index) => {
        state.active[cat.id] = index < 2;
        state.rows[cat.id] = cat.defaultRows.map(([description, um, qty, price, discount]) => ({
          id: uid(),
          description,
          um,
          qty,
          price,
          discount,
          ivaCode: "22"
        }));
      });
      document.getElementById("clientName").value = "";
      document.getElementById("siteName").value = "";
      document.getElementById("quoteDate").value = todayISO();
    }

    function renderLogos() {
      const checked = Array.from(document.querySelectorAll(".logo-check:checked")).map(input => input.value);
      const selected = logoOrder.filter(key => checked.includes(key) || key === "bau");
      brandLogos.innerHTML = "";
      selected.forEach(key => {
        const logo = LOGOS[key];
        if (!logo) return;
        const card = document.createElement("div");
        card.className = `brand-logo-card ${logo.className}`.trim();
        card.innerHTML = `<img src="${logo.src}" alt="${logo.label}" />`;
        brandLogos.appendChild(card);
      });
    }

    function createToggle(cat) {
      const label = document.createElement("label");
      label.className = "section-toggle";
      label.innerHTML = `
        <input type="checkbox" ${state.active[cat.id] ? "checked" : ""} data-section-toggle="${cat.id}" />
        <div><strong>${escapeHTML(cat.label)}</strong><span style="background:${cat.color}"></span></div>
      `;
      return label;
    }

    function createIvaOptions(selectedCode = "22") {
      return IVA_CODES.map(code => {
        const selected = String(selectedCode || "22") === code.value ? " selected" : "";
        return `<option value="${escapeHTML(code.value)}"${selected}>${escapeHTML(code.label)}</option>`;
      }).join("");
    }

    function createSection(cat) {
      if (!state.active[cat.id]) return null;
      const section = document.createElement("article");
      section.className = "section";
      section.dataset.section = cat.id;
      section.innerHTML = `
        <div class="section-head" style="background:${cat.color}">
          <div class="section-title">${escapeHTML(cat.label)}</div>
          <div class="section-actions">
            <button type="button" class="small-btn" data-add-row="${cat.id}">+ Riga</button>
            <button type="button" class="small-btn" data-add-five="${cat.id}">+5 righe</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Descrizione</th>
              <th>U.M.</th>
              <th>Q.tà</th>
              <th class="col-price">Prezzo unit.</th>
              <th class="col-discount">Sconto %</th>
              <th class="col-iva">Cod. IVA</th>
              <th>Netto</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody>
            ${state.rows[cat.id].map(row => createRowHTML(cat.id, row)).join("")}
            <tr class="subtotal-row">
              <td colspan="6">Subtotale ${escapeHTML(cat.label)}</td>
              <td class="subtotal-value" data-subtotal="${cat.id}">€ 0,00</td>
              <td class="col-actions"></td>
            </tr>
          </tbody>
        </table>
      `;
      return section;
    }

    function createRowHTML(catId, row) {
      return `
        <tr data-row="${row.id}" data-cat="${catId}">
          <td><input class="cell-input" data-field="description" value="${escapeHTML(row.description || "")}" /></td>
          <td><input class="cell-input" data-field="um" value="${escapeHTML(row.um || "")}" /></td>
          <td><input class="cell-input number" type="number" min="0" step="0.01" data-field="qty" value="${num(row.qty)}" /></td>
          <td class="col-price"><input class="cell-input number" type="number" step="0.01" data-field="price" value="${num(row.price)}" /></td>
          <td class="col-discount"><input class="cell-input number" type="number" min="0" max="100" step="0.01" data-field="discount" value="${num(row.discount)}" /></td>
          <td class="col-iva"><select class="cell-select" data-field="ivaCode">${createIvaOptions(row.ivaCode)}</select></td>
          <td class="money-cell" data-net="${row.id}">€ 0,00</td>
          <td class="col-actions"><button type="button" class="delete-row" data-delete-row="${row.id}" title="Elimina riga">×</button></td>
        </tr>
      `;
    }

    function syncFromDOM() {
      document.querySelectorAll("tr[data-row]").forEach(tr => {
        const catId = tr.dataset.cat;
        const rowId = tr.dataset.row;
        const row = state.rows[catId]?.find(item => item.id === rowId);
        if (!row) return;
        tr.querySelectorAll("[data-field]").forEach(input => {
          const field = input.dataset.field;
          row[field] = ["qty", "price", "discount"].includes(field) ? num(input.value) : input.value;
        });
        if (!row.ivaCode) row.ivaCode = "22";
      });
    }

    function calcRow(row) {
      return num(row.qty) * num(row.price) * (1 - num(row.discount) / 100);
    }

    function calculate() {
      let totalNet = 0;
      let totalIva = 0;
      categories.forEach(cat => {
        if (!state.active[cat.id]) return;
        let subtotal = 0;
        state.rows[cat.id].forEach(row => {
          const net = calcRow(row);
          subtotal += net;
          totalIva += net * num(row.ivaCode || "22") / 100;
          const netCell = document.querySelector(`[data-net="${row.id}"]`);
          if (netCell) netCell.textContent = euro.format(net);
        });
        totalNet += subtotal;
        const subtotalCell = document.querySelector(`[data-subtotal="${cat.id}"]`);
        if (subtotalCell) subtotalCell.textContent = euro.format(subtotal);
      });

      const showIva = document.getElementById("showIva").checked;
      document.getElementById("totalNet").textContent = euro.format(totalNet);
      document.getElementById("totalIva").textContent = euro.format(showIva ? totalIva : 0);
      document.getElementById("totalGrand").textContent = euro.format(showIva ? totalNet + totalIva : totalNet);
    }

    function updateSubtotalColspans() {
      let columnsBeforeNet = 3;
      if (document.getElementById("showUnitPrice").checked) columnsBeforeNet += 1;
      if (document.getElementById("showDiscount").checked) columnsBeforeNet += 1;
      if (document.getElementById("showIva").checked) columnsBeforeNet += 1;
      document.querySelectorAll(".subtotal-row td:first-child").forEach(cell => {
        cell.colSpan = columnsBeforeNet;
      });
    }

    function updateDisplayOptions() {
      const body = document.body;
      body.classList.toggle("hide-unit-price", !document.getElementById("showUnitPrice").checked);
      body.classList.toggle("hide-discount", !document.getElementById("showDiscount").checked);
      body.classList.toggle("hide-subtotals", !document.getElementById("showSubtotals").checked);
      body.classList.toggle("hide-totals", !document.getElementById("showTotals").checked);
      body.classList.toggle("hide-iva", !document.getElementById("showIva").checked);
      body.classList.toggle("hide-actions", document.getElementById("cleanMode").checked);
      updateSubtotalColspans();
    }

    function render() {
      renderLogos();
      sectionToggles.innerHTML = "";
      categories.forEach(cat => sectionToggles.appendChild(createToggle(cat)));
      sectionsContainer.innerHTML = "";
      categories.forEach(cat => {
        const section = createSection(cat);
        if (section) sectionsContainer.appendChild(section);
      });
      bindDynamicEvents();
      updateDisplayOptions();
      calculate();
    }

    function addRow(catId, shouldRender = true) {
      syncFromDOM();
      state.rows[catId].push({ id: uid(), description: "", um: "nr", qty: 1, price: 0, discount: 0, ivaCode: "22" });
      if (shouldRender) render();
    }

    function resetPreventivo() {
      if (!confirm("Creare un nuovo preventivo? I dati correnti verranno eliminati.")) return;
      categories.forEach((cat, index) => {
        state.active[cat.id] = index < 2;
        state.rows[cat.id] = [{ id: uid(), description: "", um: "nr", qty: 1, price: 0, discount: 0, ivaCode: "22" }];
      });
      document.getElementById("clientName").value = "";
      document.getElementById("siteName").value = "";
      document.getElementById("quoteDate").value = todayISO();
      document.getElementById("freeNotes").value = "";
      render();
    }

    function addOneRowPerSection() {
      syncFromDOM();
      categories.forEach(cat => {
        if (state.active[cat.id]) addRow(cat.id, false);
      });
      render();
    }

    function printPDF() {
      syncFromDOM();
      calculate();
      document.getElementById("cleanMode").checked = true;
      updateDisplayOptions();
      setTimeout(() => window.print(), 80);
    }

    function togglePreview() {
      const clean = document.getElementById("cleanMode");
      clean.checked = !clean.checked;
      updateDisplayOptions();
    }

    function bindDynamicEvents() {
      document.querySelectorAll("[data-section-toggle]").forEach(input => {
        input.addEventListener("change", event => {
          syncFromDOM();
          state.active[event.target.dataset.sectionToggle] = event.target.checked;
          render();
        });
      });

      document.querySelectorAll("[data-add-row]").forEach(btn => {
        btn.addEventListener("click", event => addRow(event.target.dataset.addRow));
      });

      document.querySelectorAll("[data-add-five]").forEach(btn => {
        btn.addEventListener("click", event => {
          for (let i = 0; i < 5; i += 1) addRow(event.target.dataset.addFive, false);
          render();
        });
      });

      document.querySelectorAll("[data-delete-row]").forEach(btn => {
        btn.addEventListener("click", event => {
          const rowId = event.target.dataset.deleteRow;
          const catId = event.target.closest("tr").dataset.cat;
          state.rows[catId] = state.rows[catId].filter(row => row.id !== rowId);
          render();
        });
      });

      document.querySelectorAll("[data-field]").forEach(input => {
        input.addEventListener("input", () => {
          syncFromDOM();
          calculate();
        });
        input.addEventListener("change", () => {
          syncFromDOM();
          calculate();
        });
      });
    }

    document.querySelectorAll(".logo-check").forEach(input => input.addEventListener("change", renderLogos));
    document.getElementById("showUnitPrice").addEventListener("change", updateDisplayOptions);
    document.getElementById("showDiscount").addEventListener("change", updateDisplayOptions);
    document.getElementById("showSubtotals").addEventListener("change", updateDisplayOptions);
    document.getElementById("showTotals").addEventListener("change", updateDisplayOptions);
    document.getElementById("showIva").addEventListener("change", () => { updateDisplayOptions(); calculate(); });
    document.getElementById("cleanMode").addEventListener("change", updateDisplayOptions);
    document.getElementById("resetBtn").addEventListener("click", resetPreventivo);
    document.getElementById("addAllBtn").addEventListener("click", addOneRowPerSection);
    document.getElementById("previewBtn").addEventListener("click", togglePreview);
    document.getElementById("printBtn").addEventListener("click", printPDF);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }

    initState();
    render();
  </script>
</body>
</html>
